[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hldb-research"
version = "0.1.0"
description = "Local data cleaning and strategy research helpers for dividend low-volatility replication."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "polars>=1.0",
  "duckdb>=1.0",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
